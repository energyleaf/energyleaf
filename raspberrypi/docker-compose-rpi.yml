services:
  z2m:
    image: ghcr.io/koenkk/zigbee2mqtt:2.9.1
    container_name: energyleaf-base-z2m
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=Europe/Berlin
    devices:
      - /dev/serial0:/dev/ttyACM0
    network_mode: host

  postgres:
    image: postgres:17
    container_name: energyleaf-db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/energyleaf/energyleaf-standalone:0.3.1
    container_name: energyleaf-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@energyleaf-db:5432/${POSTGRES_DB}
      CRON_SECRET: ${CRON_SECRET}
      DISABLE_EXPERIMENT: "true"
      DISABLE_LOGS: "true"
      DISABLE_SIGNUP: "false"
      DISABLE_TRACKING: "true"
    ports:
      - "80:3000"

  sidecar:
    image: ghcr.io/energyleaf/energyleaf-cron:0.2
    container_name: energyleaf-sidecar
    restart: unless-stopped
    depends_on:
      - app
    init: true
    environment:
      APP_URL: http://app:3000/api
      SECRET_KEY: ${CRON_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@energyleaf-db:5432/${POSTGRES_DB}

volumes:
  postgres-data:
  zigbee2mqtt-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/energyleaf/zigbee2mqtt-data